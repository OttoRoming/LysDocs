[global]
respect-gitignore = true

[MD033]
allowed-elements = ["kbd", "br", "details", "summary"]

[MD013]
line-length = 80
reflow = true
tables = false
code-blocks = false
code-spans = false
headings = false

[MD060]
enabled = true
style = "aligned"
max-width = 0

[per-file-flavor]
"src/content/docs/**/*.mdx" = "mdx"
"src/content/systems/**/*.mdx" = "mdx"
"README.md" = "goldmark" # Forgejo uses goldmark https://docs.codeberg.org/markdown/

[per-file-ignores]
"src/content/docs/rootmanualen/Nätverk/ipv6.md" = ["MD033"]
"src/content/docs/**/*.mdx" = ["MD034"]
