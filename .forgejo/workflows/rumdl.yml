name: Rumdl Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rumdl:
    container:
      image: forge.lysator.liu.se/kindergarten/runners/alpine-docker:latest

    runs-on: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run rumdl
        run: npm run check:rumdl
