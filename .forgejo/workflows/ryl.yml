---
name: ryl check

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ryl:
    container:
      image: forge.lysator.liu.se/kindergarten/runners/alpine-docker:latest

    runs-on: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run ryl
        run: npm run ryl:check
