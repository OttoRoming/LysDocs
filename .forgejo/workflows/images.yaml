---
name: Build Docker images for LysDocs

# Images are rebuilt nightly and on changes to the master branch.
"on":
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: docker
    container:
      image: forge.lysator.liu.se/kindergarten/runners/alpine-docker:latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: forge.lysator.liu.se
          username: ${{ secrets.CONTAINER_REGISTRY_USER }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          pull: true
          push: true
          tags: |
            forge.lysator.liu.se/lysdocs/lysdocs/lysdocs:latest
            forge.lysator.liu.se/lysdocs/lysdocs/lysdocs:${{ forgejo.sha }}
