---
name: Astro Build

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    container:
      image: forge.lysator.liu.se/kindergarten/runners/alpine-docker:latest

    runs-on: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Run Astro build
        run: npm run build
