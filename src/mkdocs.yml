# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: LysDocs

theme:
  name: material
  favicon: assets/lysdocs.svg
  logo: assets/lysdocs.svg
  features: 
    - header.autohide
    - navigation.tabs
    - navigation.footer
    - content.action.edit
    - navigation.sections
  language: sv
  palette:
  - scheme: default
    primary: custom
    accent: orange
    toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: orange
    toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon: 
    edit: material/pencil
    view: material/eye

extra_css:
  - extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://lysator.liu.se
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/Lysator.liu.se/

repo_name: lysdocs-gitlab
repo_url: https://git.lysator.liu.se/lysdocs/lysdocs
edit_uri: tree/main/src/docs
plugins:
  - search
  - tags
  - open-in-new-tab
