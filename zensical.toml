[project]

site_name = "LysDocs"
site_dir = "public"
site_url = "https://docs.lysator.liu.se/"
site_description = "LysDocs är en samling guider och dokumentation för datorföreningen Lysators olika system."

repo_url = "https://git.lysator.liu.se/lysdocs/lysdocs"
repo_name = "lysdocs/lysdocs"

extra.generator = false
copyright = """
<div style="display: flex; gap: 0.5em">
	<img height="20" width="20" src="/assets/lyslogo.svg" />
	Lysator
</div>
Skapad med
<a
	href="https://zensical.org/docs"
	target="_blank"
	rel="noopener"
>
	Zensical
</a>
"""

[project.theme]

favicon = "assets/lysdocs.svg"
logo = "assets/lysdocs.svg"

language = "sv"

font.text = "Hanken Grotesk"

features = [
  "navigation.instant",
  "navigation.instant.prefetch"
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
accent = "yellow"
toggle.icon = "lucide/sun-moon"
toggle.name = "Byt till automatisk tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
accent = "yellow"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Byt till mörkt tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
accent = "yellow"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Byt till ljust tema"


[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://www.lysator.liu.se"

