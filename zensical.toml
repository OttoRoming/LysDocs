[project]

site_name = "LysDocs"
site_dir = "public"
site_url = "https://docs.lysator.liu.se/"
site_description = "LysDocs är en samling guider och dokumentation för datorföreningen Lysators olika system."

repo_url = "https://git.lysator.liu.se/lysdocs/lysdocs"
repo_name = "lysdocs/lysdocs"

extra_css = ["extra.css"]

extra.generator = false
copyright = """
<div style="display: flex; gap: 0.5em">
	<img height="20" width="20" src="/assets/lyslogo.svg" />
	Lysator
</div>
Skapad med
<a
	href="https://zensical.org/docs"
	target="_blank"
	rel="noopener"
>
	Zensical
</a>
"""

# Navigationen definieras explicit för att styra ordningen på sektionerna och
# deras namn. Sidor som inte listas här hamnar inte i menyn. Titeln på varje
# sida hämtas fortfarande från sidan själv (rubrik eller `title` i front
# matter) — bara sektionsnamnen anges nedan.
