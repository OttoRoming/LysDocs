image: ghcr.io/astral-sh/uv:0.5-python3.13-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  # needed for `mkdocs-git-authors` and `mkdocs-git-revision-date`
  IS_PRODUCTION: true
  GIT_DEPTH: 0 

build:
  stage: build
  rules:
    - changes:
      - "docs/**"
      - .gitlab-ci.yml
      - mkdocs.yml
  cache:
  - paths:
      - $UV_CACHE_DIR
    key:
      files:
        - uv.lock

  before_script:
    - uv cache prune --ci
  script:
    - uv mkdocs build
  artifacts:
    paths:
      - "public/"
    expire_in: 1 hour

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none # don't need to clone for this step
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
      - "docs/**"
      - .gitlab-ci.yml
      - mkdocs.yml
  before_script:
    - pwd
    - mkdir -p ~/.ssh
    - cp $KNOWN_HOSTS ~/.ssh/known_hosts
    - cp $SSH_PRIVATE_KEY ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - rsync -av --delete public/ lysdocs@leslie.lysator.liu.se:/var/www/html/lysdocs/
