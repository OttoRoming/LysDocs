variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IS_PRODUCTION: true


build:
  stage: build
  rules:
    - changes:
      - "docs/**"
      - .gitlab-ci.yml
      - mkdocs.yml
  cache:
  - paths:
      - .cache/pip # general cache
  - key:
      files:
        - requirements.txt
    paths:
    - venv/ # only cache venv if no requirements changed

  before_script:
    - test -f venv/bin/python || python3 -m venv venv # Either venv is restored from cache, or needs to be create
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - mkdocs build
  artifacts:
    paths:
      - "public/"
    expire_in: 1 hour

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none # don't need to clone for this step
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - rsync -a --delete public/ littlefox@totoro.lysator.liu.se:/lysator/www/roxen/lysdocs/
