image: python3

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  # needed for `mkdocs-git-authors` and `mkdocs-git-revision-date`
  IS_PRODUCTION: true
  GIT_DEPTH: 0 

build:
  stage: build
  rules:
    - changes:
      - "docs/**"
      - .gitlab-ci.yml
      - mkdocs.yml
  cache:
  - paths:
      - .cache/pip # general cache
  - key:
      files:
        - requirements.txt
    paths:
    - venv/ # only cache venv if no requirements changed

  before_script:
    - test -f venv/bin/python || python3 -m venv venv # Either venv is restored from cache, or needs to be create
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - mkdocs build
  artifacts:
    paths:
      - "public/"
    expire_in: 1 hour

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none # don't need to clone for this step
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
      - "docs/**"
      - .gitlab-ci.yml
      - mkdocs.yml
  before_script:
    - pwd
    - mkdir -p ~/.ssh
    - cp $KNOWN_HOSTS ~/.ssh/known_hosts
    - cp $SSH_PRIVATE_KEY ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - rsync -av --delete public/ lysdocs@leslie.lysator.liu.se:/var/www/html/lysdocs/
