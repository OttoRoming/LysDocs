job:
  stage: build
  script:
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - cd lysdoc/
    - mkdocs build --site-dir public
    - ssh -v littlefox@shipon.lysator.liu.se echo "i'm in boys"
    - rsync -avzP --delete public/ littlefox@shipon.lysator.liu.se:/lysator/www/roxen/lysdocs/
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - lysdoc/public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
