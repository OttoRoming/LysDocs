# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: LysDocs

site_dir: "public"

site_url: https://docs.lysator.liu.se/
site_description: LysDocs är en samling guider och dokumentation för datorföreningen Lysators olika system.

repo_url: https://git.lysator.liu.se/lysdocs/lysdocs
repo_name: lysdocs/lysdocs

theme:
  name: material
  custom_dir: overrides
  favicon: assets/lysdocs.svg
  logo: assets/lysdocs.svg
  features:
    - header.autohide
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - content.action.edit
    - navigation.sections
    - content.code.copy
  language: sv
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: yellow
      toggle:
        icon: octicons/sun-16
        name: Byt till mörkt tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: yellow
      toggle:
        icon: octicons/moon-16
        name: Byt till ljust tema
  font:
    text: Hanken Grotesk

extra_css:
  - extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://lysator.liu.se
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/Lysator.liu.se/

plugins:
  - search
  - tags
  - open-in-new-tab
  - git-revision-date-localized:
      enabled: !ENV [IS_PRODUCTION, false]
      type: timeago
  - git-authors:
      enabled: !ENV [IS_PRODUCTION, false]
      show_email_address: false
  - mkdocs-nav-weight

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - sane_lists

exclude_docs: |
  *.dg.py
