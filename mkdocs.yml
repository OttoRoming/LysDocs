# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: LysDocs

site_dir: "public"

site_url: https://lysator.liu.se/lysdocs

repo_url: https://git.lysator.liu.se/lysdocs/lysdocs
repo_name: lysdocs/lysdocs

theme:
  name: material
  custom_dir: overrides
  favicon: assets/lysdocs.svg
  logo: assets/lysdocs.svg
  features:
    - header.autohide
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - content.action.edit
    - navigation.sections
  language: sv
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: yellow
      accent: yellow
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: yellow
      accent: yellow
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    edit: material/pencil
    view: material/eye

extra_css:
  - extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://lysator.liu.se
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/Lysator.liu.se/
  generator: false

plugins:
  - search
  - tags
  - open-in-new-tab
  - git-revision-date-localized:
      enabled: !ENV [IS_PRODUCTION, false]
      type: timeago
  - git-authors:
      enabled: !ENV [IS_PRODUCTION, false]
      show_email_address: false

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - sane_lists
